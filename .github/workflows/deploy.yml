name: Deploy scheduled Firebase jobs

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-scheduled-functions:
    name: Deploy scheduled Firebase functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install function dependencies
        run: npm install --prefix functions

      - name: Build scheduled functions
        run: npm run build --prefix functions

      - name: Require Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is required to deploy scheduled functions."
            exit 1
          fi

      # The Next.js website is deployed independently by Firebase App Hosting
      # from the connected main branch. This workflow updates only the scheduler.
      - name: Deploy AK scheduler
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/firebase-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-key.json"
          trap 'rm -f "$RUNNER_TEMP/firebase-key.json"' EXIT
          npx --yes firebase-tools deploy --only functions:despertadorTareasAutomaticas \
            --project presupuestador-ak-producciones \
            --non-interactive \
            --force
