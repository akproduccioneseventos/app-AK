# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure
# Deploy trigger: 2026-03-30T01:10:00Z — force Firebase App Hosting rebuild

runConfig:
  cpu: 1
  memoryMiB: 512
  maxInstances: 4
  minInstances: 0
  concurrency: 80

env:
  - variable: USE_FIREBASE_DATA
    value: "true"
    availability:
      - RUNTIME
      - BUILD

  # ── Firebase client public variables ──────────────────────────────────────
  # These are PUBLIC values (not secrets). They are required by:
  #   - src/lib/firebase/config.ts (Firestore client)
  #   - src/lib/firebase/messaging.ts (FCM / push notifications)
  #   - scripts/generate-firebase-messaging-sw.mjs (service worker generation at build time)
  #
  # Values derivable from the project ID are stored inline (value:).
  # The remaining values (API key, sender ID, app ID, VAPID key) must be set
  # in the Firebase App Hosting console under Environment variables for this backend.
  # They are NOT stored in Secret Manager — they are public Firebase client identifiers.
  # ─────────────────────────────────────────────────────────────────────────
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "presupuestador-ak-producciones"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "presupuestador-ak-producciones.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "presupuestador-ak-producciones.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_VAPID_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: GOOGLE_API_KEY
    secret: google-api-key
    availability:
      - RUNTIME