# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure
# Deploy trigger: 2026-06-11T12:11:00Z - force Firebase App Hosting rebuild

runConfig:
  cpu: 1
  memoryMiB: 512
  maxInstances: 4
  minInstances: 0
  concurrency: 80

env:
  - variable: USE_FIREBASE_DATA
    value: "true"
    availability:
      - RUNTIME
      - BUILD

  # Firebase project identifiers.
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "presupuestador-ak-producciones"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyDk_9nYp-WZIxMx4TbzS41_9uVmb3Q3Xnc"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "presupuestador-ak-producciones.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "presupuestador-ak-producciones.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "829175724052"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:829175724052:web:eb6041e28a2ebb7e380f01"
    availability:
      - BUILD
      - RUNTIME
  - variable: AUTH_RECOVERY_EMAIL
    value: "akproduccionessalto@gmail.com"
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_AUTH_ALLOWED_EMAILS
    value: "akproduccionessalto@gmail.com"
    availability:
      - BUILD
      - RUNTIME

  - variable: GOOGLE_API_KEY
    secret: google-api-key
    availability:
      - RUNTIME

  - variable: GEMINI_MODEL
    value: "googleai/gemini-3-flash-preview"
    availability:
      - BUILD
      - RUNTIME
  - variable: GEMINI_MODEL_FAST
    value: "googleai/gemini-3-flash-preview"
    availability:
      - BUILD
      - RUNTIME
  - variable: GEMINI_MODEL_PRO
    value: "googleai/gemini-3-pro-preview"
    availability:
      - BUILD
      - RUNTIME
  - variable: GEMINI_MODEL_MARKETING
    value: "googleai/gemini-3-flash-preview"
    availability:
      - BUILD
      - RUNTIME
  - variable: GEMINI_MODEL_COMMERCIAL
    value: "googleai/gemini-3-flash-preview"
    availability:
      - BUILD
      - RUNTIME
  - variable: GEMINI_IMAGE_MODEL
    value: "googleai/gemini-3.1-flash-image-preview"
    availability:
      - BUILD
      - RUNTIME

  # Google Workspace OAuth is optional. Do not declare client secrets here unless
  # they already exist in Secret Manager and App Hosting has been granted access.
  # Declaring a missing or unauthorized secret makes Firebase App Hosting fail
  # before the app build starts.
  #
  # To enable Calendar/Gmail sync later:
  # 1) create the secrets google-client-id and google-client-secret
  # 2) grant App Hosting access with firebase apphosting:secrets:grantaccess
  # 3) restore GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET as secret variables.
  - variable: GOOGLE_OAUTH_REDIRECT_PATH
    value: "/api/google/oauth/callback"
    availability:
      - RUNTIME
  - variable: GOOGLE_WORKSPACE_CALENDAR_ID
    value: "primary"
    availability:
      - RUNTIME
