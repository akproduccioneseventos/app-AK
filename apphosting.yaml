# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure
# Deploy trigger: 2026-06-11T12:11:00Z - force Firebase App Hosting rebuild

runConfig:
  cpu: 1
  memoryMiB: 512
  maxInstances: 4
  minInstances: 0
  concurrency: 80

env:
  - variable: USE_FIREBASE_DATA
    value: "true"
    availability:
      - RUNTIME
      - BUILD

  # Firebase project identifiers.
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "presupuestador-ak-producciones"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyDk_9nYp-WZIxMx4TbzS41_9uVmb3Q3Xnc"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "presupuestador-ak-producciones.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "presupuestador-ak-producciones.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "829175724052"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:829175724052:web:eb6041e28a2ebb7e380f01"
    availability:
      - BUILD
      - RUNTIME
  - variable: AUTH_RECOVERY_EMAIL
    value: "akproduccionessalto@gmail.com"
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_AUTH_ALLOWED_EMAILS
    value: "akproduccionessalto@gmail.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: AUTH_ALLOWED_EMAILS
    value: "akproduccionessalto@gmail.com"
    availability:
      - RUNTIME

  # Secure server-side authentication. Values live in Google Secret Manager.
  - variable: APP_PASSWORD
    secret: admin-bootstrap-password
    availability:
      - RUNTIME
  - variable: AK_SESSION_SECRET
    secret: session-secret
    availability:
      - RUNTIME

  - variable: GOOGLE_API_KEY
    secret: google-api-key
    availability:
      - RUNTIME

  - variable: GEMINI_MODEL
    value: "googleai/gemini-3-flash-preview"
    availability:
      - BUILD
      - RUNTIME
  - variable: GEMINI_MODEL_FAST
    value: "googleai/gemini-3-flash-preview"
    availability:
      - BUILD
      - RUNTIME
  - variable: GEMINI_MODEL_PRO
    value: "googleai/gemini-3-pro-preview"
    availability:
      - BUILD
      - RUNTIME
  - variable: GEMINI_MODEL_MARKETING
    value: "googleai/gemini-3-flash-preview"
    availability:
      - BUILD
      - RUNTIME
  - variable: GEMINI_MODEL_COMMERCIAL
    value: "googleai/gemini-3-flash-preview"
    availability:
      - BUILD
      - RUNTIME
  - variable: GEMINI_IMAGE_MODEL
    value: "googleai/gemini-3.1-flash-image-preview"
    availability:
      - BUILD
      - RUNTIME

  # Google Workspace OAuth: Calendar and Gmail recovery messages.
  - variable: NEXT_PUBLIC_APP_URL
    value: "https://akproducciones.uy"
    availability:
      - BUILD
      - RUNTIME
  - variable: GOOGLE_CLIENT_ID
    secret: google-client-id
    availability:
      - RUNTIME
  - variable: GOOGLE_CLIENT_SECRET
    secret: google-client-secret
    availability:
      - RUNTIME
  - variable: GOOGLE_OAUTH_REDIRECT_PATH
    value: "/api/google/oauth/callback"
    availability:
      - RUNTIME
  - variable: GOOGLE_WORKSPACE_CALENDAR_ID
    value: "primary"
    availability:
      - RUNTIME
  - variable: GOOGLE_WORKSPACE_SEND_UPDATES
    value: "all"
    availability:
      - RUNTIME
