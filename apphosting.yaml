# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure
# Deploy trigger: 2026-03-30T01:10:00Z — force Firebase App Hosting rebuild

runConfig:
  cpu: 1
  memoryMiB: 512
  maxInstances: 4
  minInstances: 0
  concurrency: 80

env:
  - variable: USE_FIREBASE_DATA
    value: "true"
    availability:
      - RUNTIME
      - BUILD

  # ── Firebase client variables ─────────────────────────────────────────────
  # Required by:
  #   - src/lib/firebase/config.ts (Firestore client)
  #   - src/lib/firebase/messaging.ts (FCM / push notifications)
  #   - scripts/generate-firebase-messaging-sw.mjs (service worker generation at build time)
  #
  # Values that can be derived from the project ID are stored inline (value:).
  # Values that are project-specific credentials are stored in Google Secret Manager (secret:).
  #
  # To create the required secrets in Google Secret Manager, run:
  #   gcloud secrets create firebase-api-key --data-file=- <<< "YOUR_API_KEY"
  #   gcloud secrets create firebase-messaging-sender-id --data-file=- <<< "YOUR_SENDER_ID"
  #   gcloud secrets create firebase-app-id --data-file=- <<< "YOUR_APP_ID"
  #   gcloud secrets create firebase-vapid-key --data-file=- <<< "YOUR_VAPID_KEY"
  #
  # Values are obtained from Firebase Console → Project Settings → General → Your apps → SDK setup.
  # VAPID key: Firebase Console → Project Settings → Cloud Messaging → Web Push certificates.
  # ─────────────────────────────────────────────────────────────────────────

  # ── Derivable from project ID (safe to store as value) ──────────────────
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "presupuestador-ak-producciones"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "presupuestador-ak-producciones.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "presupuestador-ak-producciones.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME

  # ── Project-specific credentials (stored in Google Secret Manager) ───────
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: firebase-api-key
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: firebase-messaging-sender-id
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: firebase-app-id
    availability:
      - BUILD
      - RUNTIME

  # ── FCM Web Push VAPID key ────────────────────────────────────────────────
  # Obtain from Firebase Console → Project Settings → Cloud Messaging → Web push certificates.
  - variable: NEXT_PUBLIC_FIREBASE_VAPID_KEY
    secret: firebase-vapid-key
    availability:
      - BUILD
      - RUNTIME

  - variable: GOOGLE_API_KEY
    secret: google-api-key
    availability:
      - RUNTIME