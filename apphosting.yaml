# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure
# Deploy trigger: 2026-03-30T01:10:00Z — force Firebase App Hosting rebuild

runConfig:
  cpu: 1
  memoryMiB: 512
  maxInstances: 4
  minInstances: 0
  concurrency: 80

env:
  - variable: USE_FIREBASE_DATA
    value: "true"
    availability:
      - RUNTIME
      - BUILD

  # ── Firebase client public variables ──────────────────────────────────────
  # These are PUBLIC values (not secrets). They are required by:
  #   - src/lib/firebase/config.ts (Firestore client)
  #   - src/lib/firebase/messaging.ts (FCM)
  #   - scripts/generate-firebase-messaging-sw.mjs (service worker generation)
  #
  # To configure in Firebase App Hosting:
  #   1. Go to Firebase Console → App Hosting → your backend → Environment variables
  #   2. Set each variable to the value from your Firebase project settings
  #      (Firebase Console → Project Settings → General → Your apps → SDK setup)
  # ─────────────────────────────────────────────────────────────────────────
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: GOOGLE_API_KEY
    secret: google-api-key
    availability:
      - RUNTIME