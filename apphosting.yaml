# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure
# Deploy trigger: 2026-03-30T01:10:00Z — force Firebase App Hosting rebuild

runConfig:
  cpu: 1
  memoryMiB: 512
  maxInstances: 4
  minInstances: 0
  concurrency: 80

env:
  - variable: USE_FIREBASE_DATA
    value: "true"
    availability:
      - RUNTIME
      - BUILD
  - variable: GOOGLE_API_KEY
    secret: google-api-key
    availability:
      - RUNTIME
  - variable: SESSION_SECRET
    secret: session-secret
    availability:
      - RUNTIME
  - variable: ADMIN_BOOTSTRAP_EMAIL
    secret: admin-bootstrap-email
    availability:
      - RUNTIME
  - variable: ADMIN_BOOTSTRAP_PASSWORD
    secret: admin-bootstrap-password
    availability:
      - RUNTIME
  - variable: ADMIN_FORCE_RESET
    value: "false"
    availability:
      - RUNTIME